<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Resume</title>
	<style>
		:root {
			color-scheme: light;
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
			background: #eef2f6;
			color: #17212b;
		}

		* { box-sizing: border-box; }

		body {
			margin: 0;
			min-height: 100vh;
			display: flex;
			flex-direction: column;
		}

		header {
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 1rem;
			padding: 1rem 1.5rem;
			background: #17212b;
			color: #fff;
		}

		h1 {
			margin: 0;
			font-size: 1.1rem;
			font-weight: 650;
		}

		.download {
			padding: 0.6rem 0.9rem;
			border-radius: 0.35rem;
			background: #e7b85c;
			color: #17212b;
			font-size: 0.9rem;
			font-weight: 650;
			text-decoration: none;
		}

		main {
			flex: 1;
			display: flex;
			padding: clamp(1rem, 3vw, 2rem);
		}

		iframe {
			width: 100%;
			min-height: calc(100vh - 6rem);
			border: 0;
			border-radius: 0.35rem;
			background: #fff;
			box-shadow: 0 0.5rem 1.5rem rgb(23 33 43 / 12%);
		}

		.fallback {
			margin: auto;
			padding: 2rem;
			text-align: center;
			background: #fff;
			border-radius: 0.35rem;
		}
	</style>
</head>
<body>
	<header>
		<h1>Resume</h1>
		<a class="download" href="resume.pdf" download>Download PDF</a>
	</header>
	<main>
		<iframe src="resume.pdf" title="Resume PDF">
			<div class="fallback">
				<p>Your browser cannot display the PDF inline.</p>
				<a href="resume.pdf">Open the resume PDF</a>
			</div>
		</iframe>
	</main>
</body>
</html>
